<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>LupuX AI - Chat Interface</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="pragma" content="no-cache" />
  <meta http-equiv="expires" content="0" />
  <link rel="shortcut icon" href="favicon.png?v=2024" />
  <link rel="icon" type="image/png" href="favicon.png?v=2024" />
  <link rel="stylesheet" href="style.css?v=2024" />
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="https://lupusoftco.github.io" class="logo-link">
        <img id="logoImg" src="logo_ui_dark.png" alt="LupuX AI" title="LupuX AI" width="100%">
      </a>
      <button id="newChatBtn" class="new-chat-btn" title="Yeni Sohbet Başlat">＋ Yeni Sohbet</button>
    </div>

    <div class="chat-history" id="chatList">
      <!-- Dinamik olarak doldurulur -->
    </div>

    <div class="sidebar-footer">
      <button id="exportBtn" class="footer-btn" title="Tüm Sohbetleri İndir">💾 İndir</button>
      <button id="themeBtn" class="footer-btn" title="Tema Değiştir">🌙 Tema</button>

      <div class="info-container">
        <span class="info-icon">ℹ️</span>
        <div class="info-bubble">
          <strong>LupuX AI</strong><br>
          Yapay zeka destekli sohbet<br>
          <small>Lightweight AI Assistant</small><br>
          <small>© Lupusoft</small>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN CHAT AREA -->
  <main class="chat-container">

    <!-- HEADER -->
    <header class="chat-header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <button id="menuToggle" class="menu-toggle" title="Menüyü Aç" style="display: none;">☰</button>
        <h1 class="chat-title-main">LupuX AI Sohbet</h1>
      </div>
    </header>

    <!-- MESSAGES -->
    <section class="messages" id="messages">
      <!-- Dinamik olarak doldurulur -->
    </section>

    <!-- LOADING INDICATOR -->
    <div class="loading-indicator" id="loadingIndicator" style="display:none;">
      <div class="typing-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <!-- INPUT AREA -->
    <footer class="chat-input-area">
      <div class="input-wrapper">
        <textarea
          id="prompt"
          rows="1"
          placeholder="Mesaj yaz... (Shift+Enter = yeni satır)"
          autocomplete="off"
        ></textarea>
        <button id="sendBtn" class="send-btn" title="Gönder (Enter)">➤</button>
      </div>
    </footer>

  </main>

</div>

<script src="script.js?v=2024"></script>
</body>
</html>
